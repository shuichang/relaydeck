name: ci-release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check browser test script
        run: |
          node --check scripts/test-web.cjs
          node --check scripts/test-tls.cjs

      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Check shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-sing-box.sh
          bash -n scripts/test-installer.sh
          bash -n scripts/test-install-ip.sh
          shellcheck scripts/install.sh scripts/install-sing-box.sh scripts/test-installer.sh scripts/test-install-ip.sh

      - name: Installer public IP regression
        run: bash scripts/test-install-ip.sh

      - name: Installer health regression
        run: bash scripts/test-installer.sh

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build browser test binary
        run: go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/relaydeck-ui" ./cmd/relaydeck

      - name: TLS rotation regression
        env:
          RELAYDECK_BINARY: ${{ runner.temp }}/relaydeck-ui
        run: node scripts/test-tls.cjs

      - name: Browser UI regression
        env:
          RELAYDECK_BINARY: ${{ runner.temp }}/relaydeck-ui
          RELAYDECK_UI_ARTIFACTS: ${{ runner.temp }}/relaydeck-ui-artifacts
        run: node scripts/test-web.cjs

      - name: Upload browser UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaydeck-browser-ui
          path: ${{ runner.temp }}/relaydeck-ui-artifacts
          if-no-files-found: warn
          retention-days: 2

      - name: Real protocol integration
        run: |
          sudo bash scripts/install-sing-box.sh
          RELAYDECK_SING_BOX=/usr/local/bin/sing-box RELAYDECK_TEST_DOWNLOAD=1 go test -count=1 -v ./internal/integration
          SING_BOX_BINARY=/usr/local/bin/sing-box go test -count=1 -run TestTemplatesWithOfficialSingBox ./internal/engine

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            goarm: ""
          - goarch: arm64
            goarm: ""
          - goarch: armv7
            goarm: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.mod
          cache: true

      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch == 'armv7' && 'arm' || matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA:0:12}" \
            -o dist/relaydeck \
            ./cmd/relaydeck
          file dist/relaydeck
          if file dist/relaydeck | grep -qi 'dynamically linked'; then
            echo "release binary is not statically linked" >&2
            exit 1
          fi
          go version -m dist/relaydeck
          tar -C dist -czf \
            "relaydeck_${version}_linux_${{ matrix.goarch }}.tar.gz" \
            relaydeck

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: relaydeck-linux-${{ matrix.goarch }}
          path: relaydeck_*_linux_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
          retention-days: 2

  publish:
    needs:
      - verify
      - build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: relaydeck-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f -name 'relaydeck_*_linux_*.tar.gz' | wc -l)"
          test "${count}" -eq 3
          sha256sum relaydeck_*_linux_*.tar.gz > checksums.txt
          sha256sum -c checksums.txt
          cat checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              relaydeck_*_linux_*.tar.gz checksums.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              relaydeck_*_linux_*.tar.gz checksums.txt \
              --verify-tag \
              --generate-notes
          fi
